version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  bot:
    build: ./bot
    restart: always
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./shared:/app/shared

  orchestrator:
    build: ./orchestrator
    restart: always
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./shared:/app/shared
      - worktrees:/worktrees   # git worktrees live here

  worker:
    build: ./worker
    restart: always
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 2              # run two workers so multiple tasks can execute in parallel
    volumes:
      - ./shared:/app/shared
      - worktrees:/worktrees
      - go_cache:/root/go                    # Go module cache — persists across restarts
      - go_build_cache:/root/.cache/go-build # Go build cache — keeps test runs fast
    shm_size: '2gb'            # Playwright needs extra shared memory for Chromium

volumes:
  redis_data:
  worktrees:
  go_cache:
  go_build_cache:
